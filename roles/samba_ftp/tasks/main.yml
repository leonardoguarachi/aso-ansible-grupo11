---
- name: 1. Instalar Samba y vsftpd
  ansible.builtin.zypper:
    name:
      - samba
      - vsftpd
    state: present

- name: 2. Crear usuario de sistema leo con contraseña
  ansible.builtin.user:
    name: leo
    password: "{{ 'mundolibre' | password_hash('sha512') }}"
    shell: /bin/bash
    state: present

- name: 3. Crear directorio para compartir
  ansible.builtin.file:
    path: /srv/samba/recursos
    state: directory
    owner: leo
    group: users
    mode: '2775'

- name: 4. Crear usuario de Samba
  ansible.builtin.shell: |
    (echo "mundolibre"; echo "mundolibre") | smbpasswd -s -a leo
  ignore_errors: yes

- name: 5. Configurar recurso Samba incluyendo 'create mask'
  ansible.builtin.blockinfile:
    path: /etc/samba/smb.conf
    marker: "# {mark} CONFIGURACION ASO G2"
    block: |
      [Recursos]
      path = /srv/samba/recursos
      valid users = leo
      read only = no
      create mask = 0664
      directory mask = 2775

- name: 6. Permitir escritura en el servidor FTP
  ansible.builtin.lineinfile:
    path: /etc/vsftpd.conf
    regexp: '^#?write_enable='
    line: 'write_enable=YES'

- name: 7. Habilitar e iniciar Samba y FTP
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: restarted
  loop:
    - smb
    - nmb
    - vsftpd

- name: 8. Habilitar módulo SFTP en SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Subsystem\s+sftp'
    line: 'Subsystem sftp internal-sftp'

- name: 9. Reiniciar servicio SSH para aplicar SFTP
  ansible.builtin.systemd:
    name: sshd
    state: restarted
